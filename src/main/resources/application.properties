server.port=8080
# Die Zugangsdaten werden beim Betrieb auf dem Server als Umgebungsvariablen gesetzt.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bottle_tracking}
spring.datasource.username=${DB_USERNAME:bottle_tracking}
spring.datasource.password=${DB_PASSWORD:bcd1234567}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
# Übernimmt Datenbanken aus der vorherigen Version ohne Flyway-Historie bei Version 2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
app.bootstrap.admin-username=${INITIAL_ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:bcd1234567}
